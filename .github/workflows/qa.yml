name: SitePlumb QA
# Runs the full QA suite on every push that touches the app.
# Jobs:
#   ritual  - the proven suite: syntax, parity, scans, subfilter, sim (jsdom),
#             qa.js (real Chrome: hit-tests, fonts, pixel baselines*).
#   engines - Playwright smoke in real WebKit (the Safari engine) and Firefox.
#             Blocking: engines went green on run 3, so failures now gate.
# * Pixel baselines: the runner has no qa-baseline/ directory, so qa.js
#   auto-blesses on each run there - pixel regression stays a local-ritual
#   feature; every other qa.js check is fully active in CI.

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

jobs:
  ritual:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Parity (index.html == plumb.html)
        run: cmp index.html plumb.html

      - name: Syntax + scans
        run: |
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('index.html','utf8');
            const blocks=[...s.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]);
            const big=blocks.reduce((a,b)=>b.length>a.length?b:a,'');
            fs.writeFileSync('/tmp/b.js',big);
            const cjk=(s.match(/[\\u4e00-\\u9fff\\u3040-\\u30ff]/g)||[]).length;
            const dbl=(s.match(/\\\\\\\\u[0-9a-fA-F]{4}/g)||[]).length;
            if(cjk||dbl){console.error('scan fail cjk='+cjk+' dbl='+dbl);process.exit(1);}
            console.log('scans clean');
          "
          node --check /tmp/b.js

      - name: Subfilter (isolation)
        run: node subfilter.js

      - name: Sim (jsdom, full app)
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund jsdom >/dev/null
          node sim.js

      - name: QA (real Chrome)
        run: |
          npm i --no-audit --no-fund puppeteer pixelmatch pngjs axe-core @fontsource/fraunces @fontsource/source-serif-4 @fontsource/hanken-grotesk >/dev/null
          node qa.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots
          path: app/qa-shots/
          retention-days: 14

  engines:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Playwright WebKit + Firefox smoke
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps webkit firefox
          node qa-smoke.js

  verify-live:
    # Is the LIVE site complete and self-consistent, and at least as new as the
    # commit under test? Deliberately NOT a byte-compare against this commit:
    # a later push (or a re-run of an old run) makes live legitimately differ,
    # which used to fail forever. What we actually care about:
    #   1. live app version >= this commit's version  (nothing stale shipped)
    #   2. live index.html == live plumb.html          (parity really deployed)
    #   3. live sw.js cache tag == live app version    (no half-uploaded batch)
    #   4. key pages answer 200                        (nothing missing)
    runs-on: ubuntu-latest
    needs: ritual
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages, then verify the live site
        run: |
          set -u
          ver_of(){ grep -o "PLUMB_VERSION='[0-9.]*" "$1" | head -1 | cut -d"'" -f2; }
          newer_or_equal(){ [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -1)" = "$2" ]; }
          V_REPO=$(ver_of app/index.html)
          echo "repo version: $V_REPO"
          ok=0
          for i in $(seq 1 10); do
            if curl -sf https://siteplumb.com/app/index.html -o live-index.html; then
              V_LIVE=$(ver_of live-index.html)
              echo "attempt $i: live version ${V_LIVE:-unknown}"
              if [ -n "${V_LIVE:-}" ] && newer_or_equal "$V_LIVE" "$V_REPO"; then ok=1; break; fi
            else
              echo "attempt $i: live index not reachable yet"
            fi
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "LIVE IS OLDER THAN THIS COMMIT ($V_REPO) - deploy did not land"; exit 1
          fi
          V_LIVE=$(ver_of live-index.html)
          [ "$V_LIVE" = "$V_REPO" ] && echo "live matches this commit exactly" \
            || echo "note: live ($V_LIVE) is NEWER than this commit ($V_REPO) - a later push superseded it, not a failure"

          curl -sf https://siteplumb.com/app/plumb.html -o live-plumb.html
          cmp live-index.html live-plumb.html && echo "live parity holds (index == plumb)" \
            || { echo "LIVE PARITY BROKEN - index.html and plumb.html differ"; exit 1; }

          curl -sf https://siteplumb.com/app/sw.js -o live-sw.js
          grep -q "plumb-v$V_LIVE" live-sw.js && echo "live sw.js cache matches live app version $V_LIVE" \
            || { echo "SW/APP VERSION MISMATCH - sw.js was not uploaded with the app"; exit 1; }

          for pth in / /app/ /app/privacy.html /app/terms.html /app/manifest.json; do
            curl -sf "https://siteplumb.com$pth" >/dev/null && echo "200 $pth" \
              || { echo "MISSING $pth"; exit 1; }
          done
          echo "live site verified"
