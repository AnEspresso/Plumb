name: SitePlumb QA
# Runs the full QA suite on every push that touches the app.
# Jobs:
#   ritual  - the proven suite: syntax, parity, scans, subfilter, sim (jsdom),
#             qa.js (real Chrome: hit-tests, fonts, pixel baselines*).
#   engines - Playwright smoke in real WebKit (the Safari engine) and Firefox.
#             Marked continue-on-error until validated green once; then remove
#             that line to make it blocking.
# * Pixel baselines: the runner has no qa-baseline/ directory, so qa.js
#   auto-blesses on each run there - pixel regression stays a local-ritual
#   feature; every other qa.js check is fully active in CI.

on:
  push:
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  ritual:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Parity (index.html == plumb.html)
        run: cmp index.html plumb.html

      - name: Syntax + scans
        run: |
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('index.html','utf8');
            const blocks=[...s.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]);
            const big=blocks.reduce((a,b)=>b.length>a.length?b:a,'');
            fs.writeFileSync('/tmp/b.js',big);
            const cjk=(s.match(/[\\u4e00-\\u9fff\\u3040-\\u30ff]/g)||[]).length;
            const dbl=(s.match(/\\\\\\\\u[0-9a-fA-F]{4}/g)||[]).length;
            if(cjk||dbl){console.error('scan fail cjk='+cjk+' dbl='+dbl);process.exit(1);}
            console.log('scans clean');
          "
          node --check /tmp/b.js

      - name: Subfilter (isolation)
        run: node subfilter.js

      - name: Sim (jsdom, full app)
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund jsdom >/dev/null
          node sim.js

      - name: QA (real Chrome)
        run: |
          npm i --no-audit --no-fund puppeteer pixelmatch pngjs @fontsource/fraunces @fontsource/source-serif-4 @fontsource/hanken-grotesk >/dev/null
          node qa.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots
          path: app/qa-shots/
          retention-days: 14

  engines:
    runs-on: ubuntu-latest
    continue-on-error: true   # remove after the first green run to make blocking
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Playwright WebKit + Firefox smoke
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps webkit firefox
          node qa-smoke.js

  verify-live:
    # After Pages deploys, what is LIVE must equal what is in the repo.
    # Catches the batch-upload failure modes: a missed file, a stale parity
    # copy, or a sw.js version that no longer matches the app it caches.
    runs-on: ubuntu-latest
    needs: ritual
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages, then verify live == repo
        run: |
          for i in $(seq 1 10); do
            curl -sf https://siteplumb.com/app/index.html -o live-index.html || { sleep 30; continue; }
            if cmp -s live-index.html app/index.html; then echo "live index matches repo"; ok=1; break; fi
            echo "attempt $i: live differs from repo (Pages still deploying?)"; sleep 30
          done
          [ "$ok" = "1" ] || { echo "LIVE INDEX NEVER MATCHED REPO"; exit 1; }
          curl -sf https://siteplumb.com/app/plumb.html -o live-plumb.html
          cmp live-index.html live-plumb.html && echo "live parity holds"
          curl -sf https://siteplumb.com/app/sw.js -o live-sw.js
          V=$(grep -o "PLUMB_VERSION='[0-9.]*" live-index.html | cut -d"'" -f2)
          grep -q "plumb-v$V" live-sw.js && echo "sw cache matches app version $V" || { echo "SW/APP VERSION MISMATCH"; exit 1; }
          for p in / /app/privacy.html /app/terms.html /app/manifest.json; do
            curl -sf "https://siteplumb.com$p" >/dev/null && echo "200 $p" || { echo "MISSING $p"; exit 1; }
          done
