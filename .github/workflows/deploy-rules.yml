name: Deploy Firestore rules
# Publishes firestore.rules to plumb-467a0. Does not deploy functions or storage.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth with the Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLUMB }}' > "$RUNNER_TEMP/sa.json"

      - name: Fetch live rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          TOKEN=$(gcloud auth print-access-token)
          REL=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://firebaserules.googleapis.com/v1/projects/plumb-467a0/releases/cloud.firestore")
          echo "$REL" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("live release", d.get("rulesetName","?"), d.get("createTime","?"))'
          RSET=$(echo "$REL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["rulesetName"])')
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://firebaserules.googleapis.com/v1/$RSET" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); src=d["source"]["files"][0]["content"]; open("live.rules","w").write(src); print("live bytes", len(src))'
          python3 - <<'PY'
          from pathlib import Path, re as _re
          import re
          live=Path('live.rules').read_text()
          want=Path('firestore.rules').read_text()
          print('--- live match paths ---')
          for m in re.finditer(r'match /[^\s{]+', live):
            print(' ', m.group(0))
          print('--- repo match paths ---')
          for m in re.finditer(r'match /[^\s{]+', want):
            print(' ', m.group(0))
          print('live has packet word:', 'packet' in live.lower())
          print('live has work word:', "'work'" in live or '"work"' in live)
          print('--- live tail ---')
          print(live[-1200:])
          PY

      - name: Upload live rules snapshot
        uses: actions/upload-artifact@v4
        with:
          name: live-firestore-rules
          path: live.rules

      - name: Publish if the only guest gap is work
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          live=Path('live.rules').read_text()
          want=Path('firestore.rules').read_text()
          def block(src, name):
            m=re.search(r'match /'+name+r'/\{[^}]+\} \{', src)
            return bool(m)
          print('live packets block present:', 'match /packets/' in live)
          if 'match /packets/' not in live:
            print('NOTE: live has no packets match. Refusing blind overwrite.')
            Path('skip-deploy').write_text('no-packets')
            sys.exit(0)
          if live.strip() == want.strip():
            print('ALREADY: live rules match repo')
            Path('skip-deploy').write_text('already')
            sys.exit(0)
          if 'guestWorkOk' not in want or 'match /packets/' not in want:
            print('FAIL: repo rules missing packets/guestWorkOk')
            sys.exit(1)
          print('SAFE: live packets exist; repo rules differ. Publishing.')
          sys.exit(0)
          PY
          if [ -f skip-deploy ]; then
            echo "Nothing to publish ($(cat skip-deploy))"
            exit 0
          fi
          npx firebase-tools@latest deploy --only firestore:rules --project plumb-467a0 --non-interactive
          echo 'PUBLISHED firestore.rules'
