name: Publish rules (Firestore + Storage)
# The only way security rules reach plumb-467a0. Since Release D nobody pastes
# rules into the Firebase console - not Firestore, not Storage.
#   - Manual only (workflow_dispatch). Never runs on push or pull request.
#   - Publishes only from main, so what goes live is what was reviewed and merged.
#   - The Rules suite (rules.yml) runs first. If it fails, nothing is published.
#   - The publish job waits in the "rules-publish" GitHub Environment until a
#     required reviewer (Peter) approves it. The deploy key is an environment
#     secret (FIREBASE_RULES_DEPLOYER), so no other workflow or branch can use it.
#   - The FIREBASE_RULES_DEPLOYER service account needs exactly these roles:
#     Firebase Rules Admin, Service Usage Consumer, Cloud Storage for Firebase
#     Viewer, and Firebase Viewer. Firebase Viewer lets the deploy read the
#     project's Firebase setup; without it the first publish failed with
#     "Firebase Storage has not been set up".
#   - firestore.rules and storage.rules go out together as one release, then
#     both live rulesets are read back and must match the repo byte for byte
#     (ignoring leading/trailing whitespace).
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-rules
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/rules.yml

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: rules-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auth with the rules deploy key
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_RULES_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish firestore.rules and storage.rules
        run: npx --yes firebase-tools@15.31.0 deploy --only firestore:rules,storage --project plumb-467a0 --non-interactive

      - name: Read the live rules back and compare with the repo
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          API=https://firebaserules.googleapis.com/v1
          fetch() { # $1 release name, $2 output file
            RSET=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/projects/plumb-467a0/releases/$1" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["rulesetName"])')
            curl -fsS -H "Authorization: Bearer $TOKEN" "$API/$RSET" \
              | python3 -c 'import json,sys; open(sys.argv[1],"w").write(json.load(sys.stdin)["source"]["files"][0]["content"])' "$2"
          }
          fetch cloud.firestore live-firestore.rules
          fetch firebase.storage/plumb-467a0.firebasestorage.app live-storage.rules
          python3 - <<'PY'
          from pathlib import Path
          import sys
          bad = 0
          for live, repo in (('live-firestore.rules', 'firestore.rules'), ('live-storage.rules', 'storage.rules')):
            same = Path(live).read_text().strip() == Path(repo).read_text().strip()
            print(('MATCH ' if same else 'DIFFERS ') + repo)
            bad += 0 if same else 1
          sys.exit(1 if bad else 0)
          PY

      - name: Upload live rules snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-rules-after-publish
          path: live-*.rules
          if-no-files-found: ignore
