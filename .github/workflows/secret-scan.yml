name: Secret scan
# Fails if a new commit contains a password, token or key (gitleaks with
# .gitleaks.toml). Scans only commits new to this push or pull request, so the
# old history (rotated QA passwords) does not fail every run.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks && rm gl.tgz && ./gitleaks version
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -u
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..HEAD"
          elif [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then
            RANGE="$BEFORE..HEAD"
          else
            git fetch -q origin main
            RANGE="origin/main..HEAD"
          fi
          echo "Scanning $RANGE"
          ./gitleaks git . --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner -v
