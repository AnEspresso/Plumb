name: Deploy Cloud Functions
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Pass --force (only to delete a function removed from the code, or to take a newly retried trigger). Leave off otherwise.'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Install function dependencies (exactly what package-lock.json pins)
        run: cd functions && npm ci --no-audit --no-fund

      - name: Functions tests (a failing test stops the deploy)
        run: cd functions && npm test

      - name: Write runtime .env from repo secrets
        run: |
          cat > functions/.env << EOF
          INTUIT_CLIENT_ID=${{ secrets.INTUIT_CLIENT_ID }}
          INTUIT_CLIENT_SECRET=${{ secrets.INTUIT_CLIENT_SECRET }}
          QB_ENV=${{ secrets.QB_ENV || 'sandbox' }}
          OWNER_UIDS=${{ secrets.OWNER_UIDS }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          ARCHIVE_BUCKET=${{ secrets.ARCHIVE_BUCKET || 'plumb-467a0-money-archive' }}
          APP_ORIGINS=https://siteplumb.com,https://www.siteplumb.com,https://anespresso.github.io
          EOF

      - name: Auth with the Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLUMB }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          FORCE: ${{ inputs.force && '--force' || '' }}
        # firebase-tools is pinned (same version as the repo's rules tooling; supports the nodejs24 runtime).
        # No --force by default: removing a function or adding a retry policy stops the deploy with a clear
        # message instead of happening silently. Re-run from Actions with "force" ticked when that is intended.
        run: npx --yes firebase-tools@15.31.0 deploy --only functions --project plumb-467a0 --non-interactive $FORCE
