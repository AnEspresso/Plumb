<html lang="en">
<head>

<style>
:root{
  --paper:#F2EEE6; --surface:#FBF9F4; --surface-2:#F7F3EB;
  --ink:#1B1916; --ink-2:#5C564C; --ink-3:#928B7E;
  --line:#E4DDD0; --line-2:#EDE7DB;
  --oak:#B0895A; --oak-soft:#CDB48C; --clay:#B0604A; --sage:#6F7B58;
  --f-serif:'Source Serif 4',Georgia,serif;
  --f-sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
  --f-mark:'Fraunces',Georgia,serif;
  --t-xs:12px; --t-sm:13.5px; --t-md:15.5px; --t-lg:17px; --t-xl:21px; --t-2xl:27px; --t-hero:36px;
  --lh-tight:1.15; --lh-body:1.45;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:32px; --s-8:48px;
  --r-sm:10px; --r:16px; --r-lg:24px;
  --tap:48px;
  --shadow:0 1px 2px rgba(27,25,22,.04),0 8px 24px rgba(27,25,22,.05);
  --shadow-lift:0 2px 6px rgba(27,25,22,.06),0 18px 48px rgba(27,25,22,.10);
  --z-nav:100; --z-sheet:200; --z-sheet-2:210; --z-toast:300; --z-tour:400;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;}
html,body{min-height:100%;}
body{font-family:var(--f-sans);font-size:var(--t-md);line-height:var(--lh-body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-serif);font-weight:600;line-height:var(--lh-tight);letter-spacing:-.01em;margin:0;}
.wordmark{font-family:var(--f-mark);font-weight:500;}
.meta{font-size:var(--t-xs);color:var(--ink-3);}
.sub{font-size:var(--t-sm);color:var(--ink-2);}
:focus-visible{outline:2px solid var(--oak);outline-offset:2px;border-radius:var(--r-sm);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--s-6)) var(--s-5) calc(env(safe-area-inset-bottom) + var(--s-7))}
.brand{display:flex;align-items:center;gap:var(--s-2);font-size:var(--t-lg);margin-bottom:var(--s-4)}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--oak);box-shadow:0 0 0 4px rgba(176,137,90,.14)}
.updated{background:rgba(111,123,88,.12);border:1px solid rgba(111,123,88,.28);border-radius:var(--r-sm);padding:var(--s-3);margin:0 0 var(--s-4);font-size:var(--t-sm);line-height:1.45}
.updated .when{font-size:var(--t-xs);color:var(--ink-3);margin-top:var(--s-1)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-3);margin:var(--s-7) 0 var(--s-3);}
.sec h2{font-size:var(--t-xl);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
  min-height:var(--tap);padding:0 var(--s-5);border-radius:var(--r);
  font-family:var(--f-sans);font-size:var(--t-md);font-weight:600;line-height:1;
  border:1.5px solid transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--ink);color:var(--surface);}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-quiet{background:transparent;color:var(--oak);padding:0 var(--s-3);}
.btn-block{display:flex;width:100%;}
.btn + .btn{margin-top:var(--s-2);}
.row{display:flex;align-items:center;gap:var(--s-4);min-height:var(--tap);
  padding:var(--s-4) 0;border-bottom:1px solid var(--line-2);}
.row:last-child{border-bottom:0;}
.row-main{flex:1;min-width:0;}
.row-title{font-size:var(--t-lg);font-weight:600;color:var(--ink);}
.row-sub{font-size:var(--t-sm);color:var(--ink-2);margin-top:2px;}
.row-aside{flex:none;text-align:right;font-size:var(--t-md);font-weight:600;}
.row-aside.warn{color:var(--clay);}
.row-aside.ok{color:var(--sage);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s-4);margin:var(--s-4) 0;}
.hero-n{font-family:var(--f-serif);font-size:var(--t-hero);font-weight:600;line-height:1;letter-spacing:-.02em;}
.hero-l{font-size:var(--t-md);color:var(--ink-2);margin-top:var(--s-2);}
.hero-s{font-size:var(--t-sm);color:var(--ink-3);margin-top:var(--s-3);line-height:1.5;}
.field{display:block;margin-bottom:var(--s-4);}
.field label{display:block;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);margin-bottom:var(--s-1);}
.field input,.field select,.field textarea{width:100%;min-height:var(--tap);padding:var(--s-3) var(--s-4);
  border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  font-family:var(--f-sans);font-size:var(--t-md);color:var(--ink);}
.field textarea{min-height:72px;}
.empty{padding:var(--s-7) var(--s-4);text-align:center;color:var(--ink-3);font-size:var(--t-md);line-height:1.5;}
.empty b{display:block;color:var(--ink);font-size:var(--t-lg);margin-bottom:var(--s-2);}
.toast{position:fixed;left:50%;bottom:calc(var(--s-6) + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:var(--z-toast);max-width:min(92vw,420px);padding:var(--s-3) var(--s-5);
  background:var(--ink);color:var(--surface);border-radius:var(--r);font-size:var(--t-md);box-shadow:var(--shadow-lift);
  opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;}
.chg{display:none;margin-top:var(--s-3)}
.chg.show{display:block}
.ok{padding:var(--s-4) 0;font-size:var(--t-md)}
.ok b{color:var(--sage)}
.ok.warn b{color:var(--oak)}
.foot{font-size:var(--t-xs);color:var(--ink-3);margin-top:var(--s-7);text-align:center;line-height:1.6}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:var(--s-1) 0 var(--s-3)}
.cal-nav .m{font-size:var(--t-lg);font-weight:600;font-family:var(--f-serif)}
.cal-nav button{min-width:var(--tap);min-height:var(--tap);border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:var(--t-lg);cursor:pointer;color:var(--ink)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:var(--s-1)}
.cal-dow span{text-align:center;font-size:var(--t-xs);font-weight:600;color:var(--ink-3);padding:var(--s-2) 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.gd{min-height:var(--tap);border:0;background:transparent;font:inherit;font-size:var(--t-sm);font-weight:600;color:var(--ink);cursor:pointer;padding:0}
.gd.out{color:var(--ink-3);opacity:.42}
.gd.today span{box-shadow:0 0 0 1.5px var(--oak);border-radius:50%}
.gd.mid{background:rgba(176,137,90,.16)}
.gd.start.mid-r{background:linear-gradient(90deg,transparent 50%,rgba(176,137,90,.16) 50%)}
.gd.end.mid-l{background:linear-gradient(90deg,rgba(176,137,90,.16) 50%,transparent 50%)}
.gd.start span,.gd.end span{background:var(--ink);color:var(--surface);box-shadow:none}
.gd span{display:flex;align-items:center;justify-content:center;width:32px;height:32px;margin:0 auto;border-radius:50%}
.cal-acts{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);margin-top:var(--s-3)}
.chosen{display:block;width:100%;border:0;background:transparent;font-family:var(--f-serif);font-size:var(--t-xl);font-weight:600;color:var(--ink);text-align:center;padding:var(--s-2) 0 var(--s-4);cursor:pointer;min-height:var(--tap)}
.spec-kv{display:flex;justify-content:space-between;gap:var(--s-3);font-size:var(--t-sm);padding:var(--s-1) 0}
.spec-kv .k{color:var(--ink-3)}
.spec-kv .v{font-weight:600;text-align:right}
.spec-kv .gap{color:var(--clay);font-style:italic}
.rem{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap);font-size:var(--t-sm);color:var(--ink-2)}
.rem input{width:auto;min-height:auto}
</style>

function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;",'"':"&"+"quot;","'":"&#39;"}[c];});}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},2200);}
function iso(ts){var d=new Date(Number(ts)),p=function(v){return String(v).padStart(2,"0");};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function fmtWin(w){if(!w)return "";var o={month:"short",day:"numeric"};var a=new Date(w.start).toLocaleDateString(undefined,o);var b=new Date(w.end!=null?w.end:w.start).toLocaleDateString(undefined,o);return a===b?a:a+" \u2013 "+b;}
function rangeLabel(sv,ev){if(!sv)return "Choose dates";var a=new Date(sv+"T12:00:00"),b=new Date((ev||sv)+"T12:00:00");var f=function(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});};return sv===(ev||sv)?f(a):f(a)+" \u2013 "+f(b);}

function fail(msg){
  document.getElementById("body").innerHTML='<div class="brand wordmark"><span class="dot"></span>SitePlumb</div><div class="empty"><b>This packet will not open</b>'+msg+'</div><button class="btn btn-primary btn-block" onclick="location.reload()">Try again</button>';

function row(title,sub,aside,asideCls){
  return '<div class="row"><div class="row-main"><div class="row-title">'+esc(title)+'</div>'+(sub?('<div class="row-sub">'+sub+'</div>'):'')+'</div>'+(aside?('<span class="row-aside'+(asideCls?(' '+asideCls):'')+'">'+esc(aside)+'</span>'):'')+'</div>';
}
function paint(){
  var g=_snap,body=document.getElementById("body");

  var dates=fmtWin({start:(g.resp&&g.resp.start)||g.start,end:(g.resp&&g.resp.end)||g.end});

    var ch=(g.changes&&g.changes[0])||{what:g.lastChange,t:g.lastChangeT||g.t};
    var when=ch.t?new Date(ch.t).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";

  h+='<div class="card"><div class="hero-n">'+esc(dates||"Dates coming")+'</div>';

  h+='<div class="hero-s">'+esc(g.tradeLabel)+' \u00b7 '+esc(g.sub)+' \u00b7 from '+esc(g.builder)+'</div>';
  if(g.note)h+='<div class="hero-s">'+esc(g.note)+'</div>';
  h+='</div>';
  if(g.resp&&g.resp.status==="confirmed"){
    h+='<div class="ok"><b>Confirmed.</b> You said these dates work'+(g.resp.t?(" \u00b7 "+new Date(g.resp.t).toLocaleDateString()):"")+".</div>";
    h+='<button class="btn btn-primary btn-block" onclick="gpAddToCal()">Add to my calendar</button>';
    h+='<button class="btn btn-secondary btn-block" onclick="gpToggleChange()">Suggest different dates</button>';
    h+=chgHTML();
    h+='<div class="chg" id="gpCalPick">'
      +'<div class="sec"><h2>Which calendar</h2></div>'
      +'<button class="btn btn-secondary btn-block" onclick="gpCalDevice(document.getElementById(\'gpCalRem\').checked)">This device\u2019s calendar</button>'
      +'<button class="btn btn-secondary btn-block" onclick="gpCalGoogle(document.getElementById(\'gpCalRem\').checked)">Google Calendar</button>'
      +'<label class="rem"><input type="checkbox" id="gpCalRem" checked> Remember my choice</label>'
      +'<div class="sub">On iPhone the calendar opens its own screen \u2014 tap <b>Add To Calendar</b> at the bottom of it.</div></div>';
  }else if(g.resp&&g.resp.status==="change"){
    var asked=g.resp.start?fmtWin({start:g.resp.start,end:g.resp.end||g.resp.start}):"";
    h+='<div class="ok warn"><b>Change requested.</b> '+(asked?("You asked for "+esc(asked)+". "):"")+"Your builder has this"+(g.resp.note?(" \u2014 \u201c"+esc(g.resp.note)+"\u201d"):"")+".</div>";
    h+='<button class="btn btn-secondary btn-block" onclick="gpToggleChange()">Suggest different dates</button>';
    h+=chgHTML();
  }else{
    h+='<button class="btn btn-primary btn-block" onclick="gpConfirm()">These dates work</button>';
    h+='<button class="btn btn-secondary btn-block" onclick="gpToggleChange()">Suggest different dates</button>';
    h+=chgHTML();
  }
  var cx=g.ctx||{};
  if(cx.ready||cx.permit||cx.insp){
    if(cx.ready)h+=row("House ready",esc(cx.ready),cx.readyOk?"Ready":"Not ready",cx.readyOk?"ok":"warn");
    if(cx.permit){var i=cx.permit.indexOf(": ");h+=row("Permit",esc(i>0?cx.permit.slice(0,i)+" \u2014 "+cx.permit.slice(i+2):cx.permit),"","");}
    if(cx.insp){var j=cx.insp.indexOf(": ");h+=row("Inspection",esc(j>0?cx.insp.slice(0,j)+" \u2014 "+cx.insp.slice(j+2):cx.insp),"","");}
  }
  if((cx.openItems||[]).length){
    h+='<div class="sec"><h2>Open items on your scope</h2></div>';
    h+=cx.openItems.map(function(x){return row(x,"","","");}).join("");
  }
  if((cx.history||[]).length){
    h+='<div class="sec"><h2>Before you arrive</h2></div>';
    h+=cx.history.map(function(x){return row(x.text,esc(x.d),"","");}).join("");
  }
  if((g.specs||[]).length){
    h+='<div class="sec"><h2>Install specs</h2></div>';
    h+=g.specs.map(function(sel){
      var rows=(sel.rows||[]).map(function(r){return r.gap
        ?'<div class="spec-kv"><span class="k">'+esc(r.k)+'</span><span class="v gap">awaiting '+esc(r.gap)+"</span></div>"
        :'<div class="spec-kv"><span class="k">'+esc(r.k)+'</span><span class="v">'+esc(r.v)+"</span></div>";}).join("");
      return '<div class="row"><div class="row-main"><div class="row-title">'+esc(sel.item||"(unspecified)")+'</div><div class="row-sub">'+esc(sel.cat||"")+(sel.room?" \u00b7 "+esc(sel.room):"")+"</div>"+rows+"</div></div>";
    }).join("");

  h+='<div class="sec"><h2>Questions</h2></div>';
  var qs=g.q||[];
  h+=qs.length?qs.map(function(x){
    return '<div class="row"><div class="row-main"><div class="row-title">'+esc(x.text)+'</div><div class="row-sub">'+esc(new Date(x.t).toLocaleDateString())+(x.a?(" \u00b7 "+esc(g.builder)+": "+esc(x.a)):" \u00b7 Sent \u2014 "+esc(g.builder)+" will get back to you.")+"</div></div></div>";
  }).join(""):'<div class="sub">Nothing asked yet.</div>';
  h+='<button class="btn btn-quiet btn-block" onclick="gpToggleAsk()">Ask a question</button>';
  h+='<div class="chg" id="gpAsk"><div class="field"><label>Your question</label><textarea id="gpQText" rows="2" placeholder="e.g. Is the water heater gas or electric?"></textarea></div><button class="btn btn-secondary btn-block" onclick="gpSendQuestion()">Send to '+esc(g.builder)+"</button></div>";
  h+='<button class="btn btn-quiet btn-block" onclick="gpTogglePrefs()">Preferences</button>';

  h+='<div class="chg" id="gpPrefs"><div class="field"><label>Default calendar</label><select id="gpPrefCal" onchange="setCalPref(this.value)">'
    +'<option value=""'+(cp===""?" selected":"")+">Ask each time</option>"
    +'<option value="device"'+(cp==="device"?" selected":"")+">This device\u2019s calendar</option>"
    +'<option value="google"'+(cp==="google"?" selected":"")+">Google Calendar</option></select></div>"
    +'<div class="sub">Saved on this phone.</div></div>';
  h+='<div class="foot">Sent with SitePlumb \u00b7 this link expires '+new Date(g.expires||Date.now()).toLocaleDateString()+"</div>";
  body.innerHTML=h;
}
function chgHTML(){
  return '<div class="chg" id="gpChg"><input type="hidden" id="gpStart"><input type="hidden" id="gpEnd">'
    +'<div id="gpChgCal"><div id="gpCalMount"></div><div class="cal-acts"><button type="button" class="btn btn-secondary" onclick="gpCalReset()">Reset</button>'
    +'<button type="button" class="btn btn-primary" onclick="gpCalDone()" aria-label="Use these dates">Use these dates</button></div></div>'
    +'<div id="gpChgNote" style="display:none"><button type="button" class="chosen" id="gpChosen" onclick="gpCalBack()"></button>'
    +'<div class="field"><label>Note <span class="meta">(optional)</span></label>'
    +'<textarea id="gpNote" rows="2" placeholder="Crew is on another job until Thursday"></textarea></div>'
    +'<button class="btn btn-secondary btn-block" onclick="gpSendChange()">Send to '+esc((_snap||{}).builder||"your builder")+"</button></div></div>";
}
function calHTML(cursor,sv,ev){
  if(!cursor){var n=new Date();cursor=new Date(n.getFullYear(),n.getMonth(),1);}
  var y=cursor.getFullYear(),m=cursor.getMonth();
  var first=new Date(y,m,1);
  var grid0=new Date(y,m,1-first.getDay());
  var today=iso(Date.now());
  var h='<div class="cal-nav"><button type="button" onclick="gpChgMonth(-1)" aria-label="Previous month">\u2039</button>'
    +'<div class="m">'+first.toLocaleDateString(undefined,{month:"long",year:"numeric"})+"</div>"
    +'<button type="button" onclick="gpChgMonth(1)" aria-label="Next month">\u203a</button></div>'
    +'<div class="cal-dow">'+["S","M","T","W","T","F","S"].map(function(d){return "<span>"+d+"</span>";}).join("")+'</div><div class="cal-grid">';
  for(var i=0;i<42;i++){
    var d=new Date(grid0.getFullYear(),grid0.getMonth(),grid0.getDate()+i);
    var id=iso(d.getTime());
    var cls=["gd"];
    if(d.getMonth()!==m)cls.push("out");
    if(id===today)cls.push("today");
    if(sv&&id===sv)cls.push("start");
    if(ev&&id===ev)cls.push("end");
    if(sv&&ev&&id>sv&&id<ev)cls.push("mid");
    if(sv&&ev&&id===sv&&sv!==ev)cls.push("mid-r");
    if(sv&&ev&&id===ev&&sv!==ev)cls.push("mid-l");
    if(sv&&!ev&&id===sv)cls.push("end");
    h+='<button type="button" class="'+cls.join(" ")+'" onclick="gpPickDay(\''+id+'\')"><span>'+d.getDate()+"</span></button>";
  }
  return h+"</div>";
}
window.gpChgMonth=function(d){
  if(!_cur){var n=new Date();_cur=new Date(n.getFullYear(),n.getMonth(),1);}
  _cur=new Date(_cur.getFullYear(),_cur.getMonth()+d,1);gpRenderCal();
};
window.gpPickDay=function(id){
  var s=document.getElementById("gpStart"),e=document.getElementById("gpEnd");if(!s||!e)return;
  if(!s.value||(s.value&&e.value)){s.value=id;e.value="";}
  else if(id<s.value){e.value=s.value;s.value=id;}
  else e.value=id;
  gpRenderCal();
};
function gpRenderCal(){
  var mount=document.getElementById("gpCalMount");if(!mount)return;
  if(!_cur){var n=new Date();_cur=new Date(n.getFullYear(),n.getMonth(),1);}
  var sv=(document.getElementById("gpStart")||{}).value||"";
  var ev=(document.getElementById("gpEnd")||{}).value||"";
  mount.innerHTML=calHTML(_cur,sv,ev);
}
window.gpCalReset=function(){var s=document.getElementById("gpStart"),e=document.getElementById("gpEnd");if(s)s.value="";if(e)e.value="";gpRenderCal();};
window.gpCalDone=function(){
  var s=document.getElementById("gpStart");if(!s||!s.value){toast("Pick a start date");return;}
  var e=document.getElementById("gpEnd");if(e&&(!e.value||e.value<s.value))e.value=s.value;
  var cal=document.getElementById("gpChgCal"),note=document.getElementById("gpChgNote");
  if(cal)cal.style.display="none";if(note)note.style.display="";
  var ch=document.getElementById("gpChosen");if(ch)ch.textContent=rangeLabel(s.value,(document.getElementById("gpEnd")||{}).value);
};
window.gpCalBack=function(){var cal=document.getElementById("gpChgCal"),note=document.getElementById("gpChgNote");if(cal)cal.style.display="";if(note)note.style.display="none";gpRenderCal();};
window.gpToggleChange=function(){
  var e=document.getElementById("gpChg");if(!e)return;e.classList.toggle("show");if(!e.classList.contains("show"))return;
  var cal=document.getElementById("gpChgCal"),note=document.getElementById("gpChgNote");if(cal)cal.style.display="";if(note)note.style.display="none";
  var g=_snap||{};var s=document.getElementById("gpStart"),en=document.getElementById("gpEnd");
  if(s)s.value=g.start?iso(g.start):"";if(en)en.value=(g.end||g.start)?iso(g.end||g.start):"";
  _cur=g.start?new Date(new Date(g.start).getFullYear(),new Date(g.start).getMonth(),1):null;gpRenderCal();
};
function writeResp(resp){
  _snap.resp=resp;
  var d=db();
  if(d&&TOKEN){try{d.collection("packets").doc(String(TOKEN)).update({resp:resp}).catch(function(){toast("Could not save \u2014 try again with a bar of signal");});}catch(e){toast("Could not save");}}
  paint();
}
window.gpConfirm=function(){writeResp({status:"confirmed",t:Date.now()});};
window.gpSendChange=function(){
  var sv=(document.getElementById("gpStart")||{}).value,ev=(document.getElementById("gpEnd")||{}).value;
  var st=sv?Date.parse(sv+"T12:00:00"):null;var en=ev?Date.parse(ev+"T12:00:00"):st;
  var note=((document.getElementById("gpNote")||{}).value||"").slice(0,300);
  if(!st){toast("Pick a start date");return;}
  writeResp({status:"change",start:st,end:en||st,note:note,t:Date.now()});
};
window.gpToggleAsk=function(){var e=document.getElementById("gpAsk");if(e)e.classList.toggle("show");};
window.gpTogglePrefs=function(){var e=document.getElementById("gpPrefs");if(!e)return;try{var sel=document.getElementById("gpPrefCal");if(sel)sel.value=calPref();}catch(err){}e.classList.toggle("show");};
window.gpSendQuestion=function(){
  var txt=((document.getElementById("gpQText")||{}).value||"").trim().slice(0,300);
  if(!txt){toast("Type the question");return;}
  _snap.q=(_snap.q||[]).concat([{text:txt,t:Date.now()}]);
  var d=db();
  if(d&&TOKEN){try{d.collection("packets").doc(String(TOKEN)).update({q:_snap.q}).catch(function(){toast("Could not send \u2014 try again with a bar of signal");});}catch(e){toast("Could not send");}}
  paint();
};
function ics(g){
  var d=function(ts){var x=new Date(ts),p=function(v){return String(v).padStart(2,"0");};return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate());};
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SitePlumb//Packet//EN","BEGIN:VEVENT",
    "UID:"+(g.bookingId||"pk")+"@siteplumb.com","DTSTART;VALUE=DATE:"+d(g.start),"DTEND;VALUE=DATE:"+d((g.end||g.start)+864e5),
    "SUMMARY:"+String(g.tradeLabel||"")+" \u2014 "+String(g.site||"").split(" \u00b7 ")[0],
    "DESCRIPTION:"+String(g.note||"").replace(/\n/g," "),"END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function calPref(){try{return localStorage.getItem("plumbGuestCal")||"";}catch(e){return "";}}
window.setCalPref=function(v){try{if(v)localStorage.setItem("plumbGuestCal",v);else localStorage.removeItem("plumbGuestCal");}catch(e){}};
window.gpAddToCal=function(){var pref=calPref();if(pref==="device")return gpCalDevice();if(pref==="google")return gpCalGoogle();var e=document.getElementById("gpCalPick");if(e)e.classList.toggle("show");};
window.gpCalDevice=function(remember){
  if(remember)setCalPref("device");
  try{var blob=new Blob([ics(_snap)],{type:"text/calendar;charset=utf-8"});var u=URL.createObjectURL(blob);var w=window.open(u,"_blank");
    if(!w){var a=document.createElement("a");a.href=u;a.download="siteplumb.ics";document.body.appendChild(a);a.click();a.remove();}
    setTimeout(function(){try{URL.revokeObjectURL(u);}catch(e){}},60000);
  }catch(e){toast("Could not open the calendar file");}
};
window.gpCalGoogle=function(remember){
  if(remember)setCalPref("google");
  var g=_snap;var d=function(ts){var x=new Date(ts),p=function(v){return String(v).padStart(2,"0");};return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate());};
  var u="https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent((g.tradeLabel||"")+" \u2014 "+String(g.site||"").split(" \u00b7 ")[0])
    +"&dates="+d(g.start)+"/"+d((g.end||g.start)+864e5)
    +"&details="+encodeURIComponent(String(g.note||""));
  try{window.open(u,"_blank");}catch(e){}
};
function listen(){
  try{if(_unsub){_unsub();}}catch(e){}
  _unsub=null;
  if(!TOKEN)return;
  var d=db();
  if(d){try{_unsub=d.collection("packets").doc(String(TOKEN)).onSnapshot(function(x){if(x&&x.exists){_snap=x.data();if((_snap.expires||0)<Date.now()){fail("This link has expired. Reply to the text you got and your builder will send a fresh one.");return;}paint();}});}catch(e){}}
  if(!_tick)_tick=setInterval(function(){
    if(document.visibilityState!=="visible")return;
    var d2=db();if(!d2)return;
    d2.collection("packets").doc(String(TOKEN)).get().then(function(x){if(x.exists){_snap=x.data();paint();}}).catch(function(){});
  },4000);
}
function boot(){
  if(!TOKEN){fail("This link is missing its packet. Reply to the text you got and your builder will send a fresh one.");return;}
  var t0=Date.now(),tries=0,wait=20000;
  (function look(){
    var d=db();
    if(!d){if(Date.now()-t0<wait){setTimeout(look,150);return;}fail("This link needs a connection to open. Get a bar of signal and tap Try again.");return;}
    d.collection("packets").doc(String(TOKEN)).get().then(function(x){
      if(x&&x.exists){_snap=x.data();if((_snap.expires||0)<Date.now()){fail("This link has expired. Reply to the text you got and your builder will send a fresh one.");return;}paint();listen();return;}
      if(++tries<8&&Date.now()-t0<wait){setTimeout(look,350);return;}
      fail("This link has expired or was replaced. Reply to the text you got and your builder will send a fresh one.");
    }).catch(function(){
      if(++tries<10&&Date.now()-t0<wait){setTimeout(look,400);return;}
      fail("This link needs a connection to open. Get a bar of signal and tap Try again.");
    });
  })();
}
boot();
})();
</script>
